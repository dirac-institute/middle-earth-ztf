# Directory listing appearance for /alerts/partnership/, translated from the
# .htaccess that used to live in the data directory. Included inside the
# <Directory> block for that directory in httpd.conf.

# SET INDEX OPTIONS
IndexOptions IgnoreCase FancyIndexing HTMLTable SuppressHTMLPreamble FoldersFirst VersionSort NameWidth=* DescriptionWidth=* XHTML IconHeight=16 IconWidth=16

# Other options.
# IconsAreLinks SuppressColumnSorting

# SET DISPLAY ORDER
IndexOrderDefault Descending Name

IndexStyleSheet /alerts/partnership/fancy-index/style.css

# SPECIFY HEADER FILE
HeaderName /alerts/partnership/fancy-index/header.html

# SPECIFY FOOTER FILE
ReadmeName /alerts/partnership/fancy-index/footer.html

# IGNORE THESE FILES
IndexIgnoreReset ON
IndexIgnore .ftpquota .DS_Store .git
IndexIgnore ..
IndexIgnore fancy-index
# Housekeeping files that were never meant for visitors.
IndexIgnore VALIDATE VALIDATE.out MD5SUMS.pre-normalize *~ *.bak .??*

# DEFAULT ICON
DefaultIcon /alerts/partnership/fancy-index/icons/file-text.svg

AddIcon /alerts/partnership/fancy-index/icons/back.svg ..
AddIcon /alerts/partnership/fancy-index/icons/github.svg .github
AddIcon /alerts/partnership/fancy-index/icons/nodejs.svg node_modules
AddIcon /alerts/partnership/fancy-index/icons/file-directory.svg ^^DIRECTORY^^

# SPECIFIC FILE ICONS
# https://github.com/file-icons/source
