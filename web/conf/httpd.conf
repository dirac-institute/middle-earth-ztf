# ZTF alert archive: Apache configuration.
#
# Included at the end of the stock httpd.conf of the docker.io httpd:2.4
# image (see web/Dockerfile). Plain HTTP on 8080; the VM's reverse proxy
# terminates TLS and forwards here.
#
# Everything the two .htaccess files in the data directories used to do is
# here instead, and AllowOverride is None: the data directory holds data only.

# Paths, overridable so the same file can be tested outside the container
# (tests/local_httpd_test.sh).
<IfDefine !ZTF_HTDOCS>
    Define ZTF_HTDOCS /srv/htdocs
</IfDefine>
<IfDefine !ZTF_FANCY_INDEX>
    Define ZTF_FANCY_INDEX /srv/fancy-index
</IfDefine>
<IfDefine !ZTF_CONF_DIR>
    Define ZTF_CONF_DIR /usr/local/apache2/conf/ztf
</IfDefine>
<IfDefine !ZTF_ALERTS_ROOT>
    Define ZTF_ALERTS_ROOT /data/alerts
</IfDefine>
<IfDefine !ZTF_HTPASSWD>
    Define ZTF_HTPASSWD /run/secrets/htpasswd
</IfDefine>
<IfDefine !ZTF_LISTEN>
    Define ZTF_LISTEN 8080
</IfDefine>

ServerName ${SERVER_NAME}
Listen ${ZTF_LISTEN}

# The tarballs are multi-GB files on NFS. Memory-mapping a file that changes
# or vanishes underneath Apache can crash a worker; plain reads cannot.
EnableMMAP Off
EnableSendfile Off

# Behind the VM's proxy the peer address is always the proxy; log the address
# it reports as well.
LogFormat "%h %{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{User-Agent}i\"" ztf

<VirtualHost *:${ZTF_LISTEN}>
    ServerName ${SERVER_NAME}
    CustomLog /proc/self/fd/1 ztf

    # ── Landing page ────────────────────────────────────────────────────
    DocumentRoot "${ZTF_HTDOCS}"
    <Directory "${ZTF_HTDOCS}">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # ── Index theme (header, footer, stylesheet, icons) ─────────────────
    # Baked into the image, served at the URLs it always had. These aliases
    # must come before the data aliases below: first match wins.
    Alias /alerts/public/fancy-index      "${ZTF_FANCY_INDEX}/public"
    Alias /alerts/partnership/fancy-index "${ZTF_FANCY_INDEX}/partnership"
    <Directory "${ZTF_FANCY_INDEX}">
        Options None
        AllowOverride None
        Require all granted
        AddType image/svg+xml svg svgz
        AddEncoding gzip svgz
    </Directory>
    # The partnership theme sits under the partnership URL, so it asks for
    # the password too, as it always has.
    <Directory "${ZTF_FANCY_INDEX}/partnership">
        Include "${ZTF_CONF_DIR}/partnership-auth.conf"
    </Directory>

    # ── The archive ─────────────────────────────────────────────────────
    # DirectorySlash Off: /alerts/public (no trailing slash) is answered with
    # the listing itself rather than a redirect to /alerts/public/. Apache
    # does not know the public scheme, host or port -- TLS ends at the VM's
    # proxy -- so a redirect it builds would point at http://...:8080. The
    # theme's header.html carries a <base href> so the listing's relative
    # links work from either URL.
    Alias /alerts/public      "${ZTF_ALERTS_ROOT}/public"
    Alias /alerts/partnership "${ZTF_ALERTS_ROOT}/partnership"

    <Directory "${ZTF_ALERTS_ROOT}/public">
        Options Indexes
        AllowOverride None
        DirectorySlash Off
        Require all granted
        Include "${ZTF_CONF_DIR}/autoindex-public.conf"
    </Directory>

    <Directory "${ZTF_ALERTS_ROOT}/partnership">
        Options Indexes
        AllowOverride None
        DirectorySlash Off
        Include "${ZTF_CONF_DIR}/partnership-auth.conf"
        Include "${ZTF_CONF_DIR}/autoindex-partnership.conf"
    </Directory>

    # Dot-files and anything inside a dot-directory: in-progress tarballs
    # (.tmp.*), set-aside ones (.*.OLD), old .htaccess files, .git. These
    # sections are applied after the <Directory> blocks above, so they also
    # win over a valid partnership password.
    <DirectoryMatch "^${ZTF_ALERTS_ROOT}/.*/\.">
        Require all denied
    </DirectoryMatch>
    <Directory "${ZTF_ALERTS_ROOT}">
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
