# Partnership data is for ZTF partnership members: one shared username and
# password, in an htpasswd file bind-mounted from the secrets directory
# (SECRETS.md). Included in each <Directory> that serves partnership content.
# In a <Directory>, not a <Location>: a <Location> is applied last and would
# let a valid password override the dot-file denials in httpd.conf.
AuthType Basic
AuthName "Access for ZTF Partnership Members Only"
AuthBasicProvider file
AuthUserFile "${ZTF_HTPASSWD}"
Require valid-user
