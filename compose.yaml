# ZTF alert archive.
#
#   podman compose up -d --build
#
# Three containers:
#   web         Apache on 127.0.0.1:8080: the landing page and the listings of
#               /alerts/public and /alerts/partnership. The VM's reverse proxy
#               terminates TLS and routes traffic here.
#   archivist   Every night, reads the ZTF alert stream from Kafka and writes
#               one tarball per program into the archive. No listening ports.
#   monitoring  Reports the VM's CPU, memory and disks on port 9110 for the
#               gadget monitor.
#
# SVC_USER, SVC_UID, SVC_GID, DATA_GID, SVC_FQDN and ZTF_DATA_ROOT must be set in .env
# (written by init.sh from IT's /root/VM.set). There are no defaults; missing
# values will cause podman compose to fail.

services:
  web:
    build:
      context: web
      args:
        SVC_UID: "${SVC_UID}"
        SVC_GID: "${SVC_GID}"
        SVC_USER: "${SVC_USER}"
    image: localhost/ztf-alert-archive-web:latest
    container_name: ztf-alert-archive-web
    hostname: "${SVC_FQDN}"
    environment:
      SERVER_NAME: "${SVC_FQDN}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Read-only: the web server never needs to change the archive.
      - "${ZTF_DATA_ROOT}/alerts:/data/alerts:ro"
      # htpasswd for /alerts/partnership (SECRETS.md).
      - "${ZTF_DATA_ROOT}/secrets:/run/secrets:ro"
    restart: unless-stopped
    user: "${SVC_UID}:${SVC_GID}"
    # The archive is shared through this group (the group of alerts/), not
    # owned by the service account. See DEPLOY.md, "Preparing the data directory".
    group_add:
      - "${DATA_GID}"
    labels:
      idac.service: ztf-alert-archive-web

  archivist:
    build:
      context: archivist
      args:
        SVC_UID: "${SVC_UID}"
        SVC_GID: "${SVC_GID}"
        SVC_USER: "${SVC_USER}"
    image: localhost/ztf-alert-archive-archivist:latest
    container_name: ztf-alert-archive-archivist
    hostname: "${SVC_FQDN}"
    environment:
      # The schedule in archivist/crontab is in this zone.
      TZ: America/Los_Angeles
      ZTF_BROKER: "partnership.alerts.ztf.uw.edu:9092"
      # Kafka consumer group. It must never be one that another running
      # archivist uses: two consumers in one group split the stream between
      # them, and both write incomplete tarballs that look fine. epyc used
      # "ztf-go-archivist"; this is deliberately different.
      ZTF_ARCHIVIST_GROUP: "ztf-go-archivist-vm"
      ZTF_ARCHIVE_ROOT: /data/alerts
      ZTF_SCRATCH_DIR: /data/scratch
      ZTF_LOG_DIR: /data/logs
      ZTF_SLACK_WEBHOOK_FILE: /run/secrets/slack_webhook
    volumes:
      - "${ZTF_DATA_ROOT}/alerts:/data/alerts"
      # The uncompressed tar of a night is tens of GB; it goes on the share,
      # not on the VM's disk.
      - "${ZTF_DATA_ROOT}/scratch:/data/scratch"
      - "${ZTF_DATA_ROOT}/logs:/data/logs"
      # Slack webhook for failure notices (SECRETS.md). Optional.
      - "${ZTF_DATA_ROOT}/secrets:/run/secrets:ro"
    # A night's run is 7 hours of work that cannot be resumed; give it a
    # moment to be told it is stopping, but do not wait for it.
    stop_grace_period: 10s
    restart: unless-stopped
    user: "${SVC_UID}:${SVC_GID}"
    # Write access to the archive comes from this group (the group of alerts/).
    group_add:
      - "${DATA_GID}"
    labels:
      idac.service: ztf-alert-archive-archivist

  # CPU, memory and disks of this VM, for the gadget monitor (monitoring/README.md).
  # Copied unchanged from middle-earth-gadget-monitor; its settings live in
  # monitoring/compose.yaml. Serves http://<vm fqdn>:9110/metrics.
  monitoring:
    extends:
      file: monitoring/compose.yaml
      service: monitoring
    build: monitoring
    container_name: ztf-alert-archive-service-vm
    labels:
      idac.service: ztf-alert-archive-service-vm
